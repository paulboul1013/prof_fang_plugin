<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prof_fang_plugin</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1>prof_fang_plugin</h1>

      <section class="row">
        <label class="switch-wrap" for="enabled">
          <span>Plugin</span>
          <input id="enabled" type="checkbox" />
          <span id="enabledLabel">OFF</span>
        </label>
      </section>

      <section>
        <h2>Training Mode</h2>
        <label><input type="radio" name="mode" value="speed" /> Speed Training</label>
        <label><input type="radio" name="mode" value="gaussian" /> Gaussian Blur</label>
        <label><input type="radio" name="mode" value="noise" /> Environment Noise</label>
      </section>

      <section id="speedSettings" class="mode-settings hidden">
        <h2>Speed</h2>
        <select id="speed">
          <option value="1">1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
          <option value="2.5">2.5x</option>
          <option value="3">3x</option>
        </select>
      </section>

      <section id="blurSettings" class="mode-settings hidden">
        <h2>Gaussian Blur</h2>
        <label for="blurLevel">Strength <span id="blurLevelLabel">Medium · ~2000 Hz</span></label>
        <input id="blurLevel" type="range" min="1" max="5" step="1" value="3" />
        <p class="hint">Stronger blur removes more consonant detail. Vowels and rhythm stay.</p>
      </section>

      <section id="noiseSettings" class="mode-settings hidden">
        <h2>Noise</h2>
        <label for="noiseFile">Track</label>
        <select id="noiseFile">
          <option value="People Talking Ambience Sound Effect.mp3">People Talking Ambience</option>
        </select>

        <label for="noiseVolume">Volume <span id="noiseVolumeLabel">30%</span></label>
        <input id="noiseVolume" type="range" min="0.1" max="0.5" step="0.05" value="0.3" />
      </section>

      <div class="status-row">
        <p id="status" class="status" role="status" aria-live="polite">Ready</p>
        <button id="retry" type="button" class="retry hidden">Retry</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
